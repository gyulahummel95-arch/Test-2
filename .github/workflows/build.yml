name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -n "$SIGNING_KEYSTORE" ]; then
            echo "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/autostream.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/autostream.jks" >> "$GITHUB_ENV"
            echo "Fester Signaturschlüssel wird verwendet."
          else
            echo "::warning::Secret SIGNING_KEYSTORE fehlt – APK bekommt einen zufälligen Schlüssel (siehe SIGNING.md)."
          fi
      - name: Build debug APK and run unit tests
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleDebug testDebugUnitTest --no-daemon
      - name: Show APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/*.apk | grep -i "SHA-256" || true
      - uses: actions/upload-artifact@v6
        with:
          name: AutoStream-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/

  emulator-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: chmod +x gradlew ci/run-instrumented.sh && ./ci/run-instrumented.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: emulator-test-output
          path: |
            test-output/
            app/build/reports/androidTests/
